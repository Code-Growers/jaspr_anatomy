name: jaspr_anatomy_example
description: A small server-rendered Jaspr site with deliberate reuse problems, for trying jaspr_anatomy.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  jaspr: 0.24.0-beta.1
  jaspr_anatomy:
    path: ..

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.12
  jaspr_builder: 0.24.0-beta.1
  lints: ^6.1.0

jaspr:
  mode: server
