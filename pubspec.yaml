name: jaspr_anatomy
description: See which Jaspr components make up a rendered page and where reuse is missing, as an in-page 2D/3D overlay for people and JSON reports for coding agents.
version: 0.1.0-dev.1
repository: https://github.com/Code-Growers/jaspr_anatomy
issue_tracker: https://github.com/Code-Growers/jaspr_anatomy/issues

screenshots:
  - description: The overlay on a page, with the component tree, reuse findings and the 3D layers view.
    path: doc/showcase.gif

topics:
  - jaspr
  - devtools
  - components
  - web

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: '>=13.1.0 <15.0.0'
  args: ^2.5.0
  jaspr: '>=0.24.0-beta.0 <0.25.0'
  path: ^1.9.1
  web: ^1.1.1
  yaml: ^3.1.0

dev_dependencies:
  jaspr_lints: ^0.8.0-beta.0
  jaspr_test: 0.24.0-beta.1
  lints: ^6.1.0
  test: ^1.25.8
